name: Release package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: make editor-package
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            extensions/vscode/dist/statclaim.vsix
            dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
  # Publishes with PyPI trusted publishing: no token is stored anywhere.
  # Preview tags (containing a hyphen) build but are not published.
  publish:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
