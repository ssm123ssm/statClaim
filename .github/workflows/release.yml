name: Release package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make editor-package
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            extensions/vscode/dist/statclaim.vsix
            dist/*
