name: Check
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make python-check catalogue-check repository-check
      - run: uv build
  lean-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - run: make setup
      - run: make lean-check integration-check
      - run: make editor-package
      - run: xvfb-run -a make editor-check
      - uses: actions/upload-artifact@v4
        with:
          name: statproof-vsix
          path: extensions/vscode/dist/statproof.vsix
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @devcontainers/cli@0.80.3
      - run: devcontainer up --workspace-folder . --skip-post-attach
      - run: devcontainer exec --workspace-folder . uv run --locked statproof check examples/playground.stat
      - run: devcontainer exec --workspace-folder . make catalogue-check repository-check
