name: Check
# Pushes to main, and pull requests: a branch with a pull request is checked once, not
# once for the push and again for the pull request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels its running check. On main every commit is checked
# to the end, so no commit is left without a full result: each push has its own group,
# since a group keeps only one waiting run and replaces it with the next.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make python-check catalogue-check repository-check
      - run: uv build
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel --out-dir dist
      - run: uv run --locked python scripts/check_install.py dist/statclaim-*.whl --python ${{ matrix.python }}
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make replicate tutorial-check
  # The Lean integration tests run in three shards at once. Shard a also checks the Lean
  # sources and the axioms; shard b also packages and tests the editor, whose suite
  # verifies a claim with Lean. Each shard restores the same cached build.
  lean:
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - if: matrix.shard == 'b'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install elan
        run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan/toolchains
            .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - run: make setup
      - if: matrix.shard == 'a'
        run: make lean-check
      - run: make integration-shard SHARD=${{ matrix.shard }}
      - if: matrix.shard == 'b'
        run: make editor-package
      - if: matrix.shard == 'b'
        run: xvfb-run -a make editor-check
      - if: matrix.shard == 'b'
        uses: actions/upload-artifact@v7
        with:
          name: statclaim-vsix
          path: extensions/vscode/dist/statclaim.vsix
  # Branch protection requires "lean-editor": it passes only when every shard passed. It
  # runs even after a failure, since a skipped required check would count as passing.
  lean-editor:
    needs: lean
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lean.result }}" = success
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --global @devcontainers/cli@0.80.3
      - run: devcontainer up --workspace-folder . --skip-post-attach
      - run: devcontainer exec --workspace-folder . uv run --locked statclaim check examples/playground.stat
      - run: devcontainer exec --workspace-folder . make catalogue-check repository-check
