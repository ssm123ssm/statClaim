[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "statproof"
version = "0.1.0"
description = "A statistical design checker backed by Lean (initial scaffold)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
statproof = "statproof.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/statproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
