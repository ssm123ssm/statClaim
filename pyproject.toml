[build-system]
requires = ["hatchling>=1.27,<2", "hatch-fancy-pypi-readme>=24,<26"]
build-backend = "hatchling.build"

[project]
name = "statclaim"
version = "0.1.0"
description = "Check that a statistical guarantee applies to your study: typed claims with proved, conditional or cited evidence"
dynamic = ["readme"]
keywords = ["statistics", "clinical trials", "formal verification", "lean", "study design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.12",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Supun Manathunga"}]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/ssm123ssm/statClaim"
Issues = "https://github.com/ssm123ssm/statClaim/issues"
Documentation = "https://github.com/ssm123ssm/statClaim/tree/main/docs"

[project.scripts]
statclaim = "statclaim.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/statclaim"]

# Publish only named project paths, never whatever happens to be in the folder.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/StatClaim",
    "/StatClaim.lean",
    "/lakefile.toml",
    "/lake-manifest.json",
    "/lean-toolchain",
    "/examples",
    "/docs",
    "/tests",
    "/README.md",
    "/ROADMAP.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CITATION.cff",
]

# PyPI cannot follow links relative to the repository, so point them at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://)(?!#)([^)]+)\)'
replacement = '](https://github.com/ssm123ssm/statClaim/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: integration checks that invoke the real pinned Lean backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
