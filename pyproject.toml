[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "statclaim"
version = "0.1.0"
description = "Check that a statistical guarantee applies to your study: typed claims with proved, conditional or cited evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Supun Manathunga"}]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/ssm123ssm/statClaim"
Issues = "https://github.com/ssm123ssm/statClaim/issues"
Documentation = "https://github.com/ssm123ssm/statClaim/tree/main/docs"

[project.scripts]
statclaim = "statclaim.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/statclaim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lean: integration checks that invoke the real pinned Lean backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
